name: trend3-qqq20-trader

on:
  schedule:
    - cron: "35,50 9 * * *"
      timezone: "America/New_York"
    - cron: "5 10 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the dispatch"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: trend3-qqq20-single-authoritative-worker
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      EXPECTED_ALPACA_ACCOUNT_ID: ${{ secrets.EXPECTED_ALPACA_ACCOUNT_ID }}
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER }}
      ALPACA_SIGNAL_FEED: sip_delayed
      ALPACA_QUOTE_FEED: iex
      STATE_API_URL: ${{ vars.STATE_API_URL }}
      STATE_API_WRITE_TOKEN: ${{ secrets.STATE_API_WRITE_TOKEN }}
      STATE_DB: /tmp/trend3-qqq20/state.sqlite3
      STATUS_PATH: /tmp/trend3-qqq20/dashboard.json
      INITIAL_PEAK_EQUITY: ${{ vars.INITIAL_PEAK_EQUITY }}
      CUMULATIVE_EXTERNAL_CASH_FLOW: ${{ vars.CUMULATIVE_EXTERNAL_CASH_FLOW }}
      STRATEGY_ALLOCATION: ${{ vars.STRATEGY_ALLOCATION }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
      CONFIRM_LIVE: ${{ vars.CONFIRM_LIVE }}
      CONFIRM_SCALE: ${{ vars.CONFIRM_SCALE }}
      LIVE_AUTHORIZED_UNTIL: ${{ vars.LIVE_AUTHORIZED_UNTIL }}
      DISPATCH_REASON: ${{ inputs.reason || 'github-schedule' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install frozen runtime
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Execute or safely no-op
        run: python -m trader.rebalance
      - name: Publish compact run summary
        if: always()
        shell: bash
        run: |
          echo "### Trend-3 + QQQ20" >> "$GITHUB_STEP_SUMMARY"
          echo "Dispatch: ${DISPATCH_REASON}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$STATUS_PATH" ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          with open(os.environ["STATUS_PATH"], encoding="utf-8") as f:
              d = json.load(f)
          print(f"Mode: **{d.get('mode', 'unknown')}**  ")
          print(f"State: **{(d.get('run') or {}).get('state', 'unknown')}**  ")
          print(f"Health: **{(d.get('health') or {}).get('healthy', False)}**")
          PY
          else
            echo "No status file was produced; treat this run as failed." >> "$GITHUB_STEP_SUMMARY"
          fi
