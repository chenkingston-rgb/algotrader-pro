name: trend3-qqq20-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m compileall -q trader tests selftest.py research/backtest
      - run: ruff check trader tests selftest.py research/backtest
      - run: bandit -q -r trader
      - run: pip-audit -r requirements.lock
      - run: pytest
      - run: python selftest.py
      - run: python research/backtest/reproduce.py
      - run: python research/backtest/delay_sensitivity.py
      - run: node --check cloudflare/src/index.js
      - run: node --check cloudflare/src/dashboard.js
      - run: node --check vercel/api/status.js
