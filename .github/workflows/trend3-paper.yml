name: trend3-qqq20-paper-candidate

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the paper run"
        required: false
        default: "manual-paper-validation"

permissions:
  contents: read

concurrency:
  group: trend3-qqq20-paper-candidate
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nextgen
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET }}
      EXPECTED_ALPACA_ACCOUNT_ID: ""
      ALPACA_PAPER: "true"
      ALPACA_SIGNAL_FEED: sip_delayed
      ALPACA_QUOTE_FEED: iex
      STATE_API_URL: ${{ vars.TREND3_STATE_API_URL }}
      STATE_API_WRITE_TOKEN: ${{ secrets.TREND3_STATE_API_WRITE_TOKEN }}
      STATE_DB: /tmp/trend3_qqq20.sqlite3
      STATUS_PATH: /tmp/trend3_dashboard.json
      INITIAL_PEAK_EQUITY: ${{ vars.TREND3_INITIAL_PEAK_EQUITY }}
      CUMULATIVE_EXTERNAL_CASH_FLOW: "0"
      STRATEGY_ALLOCATION: "0.10"
      ALERT_WEBHOOK_URL: ${{ secrets.TREND3_ALERT_WEBHOOK_URL }}
      HEARTBEAT_URL: ${{ secrets.TREND3_HEARTBEAT_URL }}
      CONFIRM_LIVE: ""
      CONFIRM_SCALE: ""
      LIVE_AUTHORIZED_UNTIL: ""
      DISPATCH_REASON: ${{ inputs.reason || 'github-schedule-paper' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nextgen/requirements.lock
      - name: Install frozen runtime
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Execute paper candidate or safely no-op
        run: python -m trader.rebalance
