name: AlgoTrader — Intraday Strategies (v6 — concurrency guard)
# V6: Added concurrency guard (P0 from Claude audit) + failure notification

on:
  schedule:
    # Run every 15 min 9:45 AM–3:45 PM ET (Mon–Fri).
    - cron: '*/15 13-19 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Trading mode (paper or live)'
        required: true
        default: 'live'

concurrency:
  group: intraday-trading
  cancel-in-progress: false

jobs:
  run-intraday-strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip3 install --quiet alpaca-py>=0.30.0 pandas>=2.0.0 numpy>=1.24.0 requests python-dateutil pytz

      - name: Check market hours
        id: market_check
        run: |
          python3 - <<'PYEOF'
          from datetime import datetime
          import pytz, sys
          et = pytz.timezone('America/New_York')
          now = datetime.now(et)
          if now.weekday() >= 5:
              open("market_open.txt","w").write("false")
              print("Weekend — skipping"); sys.exit(0)
          open_t  = now.replace(hour=9,  minute=45, second=0, microsecond=0)
          close_t = now.replace(hour=15, minute=45, second=0, microsecond=0)
          ok = open_t <= now <= close_t
          open("market_open.txt","w").write("true" if ok else "false")
          print(f"Market tradeable: {ok} at {now.strftime('%H:%M %Z')}")
          PYEOF
          echo "TRADEABLE=$(cat market_open.txt)" >> $GITHUB_OUTPUT

      - name: Run intraday strategies
        if: steps.market_check.outputs.TRADEABLE == 'true'
        env:
          ALPACA_PAPER_KEY:    ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_LIVE_KEY:     ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET:  ${{ secrets.ALPACA_LIVE_SECRET }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          TRADING_MODE:        ${{ github.event.inputs.mode || 'live' }}
          STRATEGY_MODE:       intraday
        run: python3 scripts/run_strategies.py

      - name: Notify on failure
        if: failure()
        run: |
          {
            echo "## AlgoTrader run FAILED"
            echo "Workflow: ${{ github.workflow }}  Run: ${{ github.run_id }}"
            echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"AlgoTrader ${{ github.workflow }} FAILED — run ${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
