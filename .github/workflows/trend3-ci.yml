name: trend3-qqq20-candidate-ci

on:
  pull_request:
    paths:
      - "nextgen/**"
      - ".github/workflows/trend3-*.yml"
      - "NEXTGEN_DEPLOYMENT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trend3-candidate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nextgen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nextgen/requirements-dev.lock
      - name: Install frozen verification environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Release self-test
        run: python selftest.py
      - name: Reproduce frozen backtest
        run: python research/backtest/reproduce.py
      - name: Static checks
        run: |
          ruff check trader tests selftest.py
          node --check cloudflare/src/index.js
          node --check cloudflare/src/dashboard.js
          node --check vercel/api/status.js
